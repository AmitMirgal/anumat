[project]
name = "anumat-engine"
version = "0.1.0"
description = "Run the Anumat engine on your machine"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.urls]
Repository = "https://github.com/AmitMirgal/anumat"

[project.scripts]
anumat-engine = "anumat_engine.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anumat_engine"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "anumat_engine/NOTICE"
"LICENSE" = "anumat_engine/LICENSE"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = ["pytest>=8.3", "pyright>=1.1.390"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"

name: Engine wheels

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded PR runs so they do not pile onto the scarce macOS pool.
concurrency:
  group: engine-wheels-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v4
      - id: set
        run: echo "include=$(jq -c . packages/engine-py/platforms.json)" >> "$GITHUB_OUTPUT"

  wheel:
    needs: platforms
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.platforms.outputs.include) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v5
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the wheel
        shell: bash
        run: bash packages/engine-py/scripts/build-wheel.sh "${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.binary }}" dist
      # Upload before Postgres. A Windows createdb DLL failure used to skip
      # these steps after a successful compile, so the wheel never reached
      # migration-checksum / release-bundle.
      - uses: actions/upload-artifact@v4
        with:
          name: anumat-engine-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: anumat-engine-migration-sha-${{ matrix.platform }}
          path: dist/migration.sha256
          if-no-files-found: error
      - name: Convert-smoke the wheel
        shell: bash
        run: bash packages/engine-py/scripts/ci-convert-smoke.sh dist
      - name: Start Postgres
        if: matrix.smoke
        uses: ikalnytskyi/action-setup-postgres@v9
        with:
          username: anumat
          password: anumat
          database: anumat_engine
          port: "5432"
          postgres-version: "16"
      - name: Smoke the wheel
        if: matrix.smoke
        shell: bash
        env:
          DATABASE_URL: postgres://anumat:anumat@127.0.0.1:5432/anumat_engine
          ANUMAT_MIGRATION_SQL: packages/db/prisma/migrations/20260929061425_init/migration.sql
        run: bash packages/engine-py/scripts/ci-smoke.sh dist

  migration-checksum:
    needs: wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: anumat-engine-migration-sha-*
          path: checksums
      - name: Assert the embedded migration checksum matches on every platform
        shell: bash
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find checksums -type f -name migration.sha256 -print0)
          count="${#files[@]}"
          if [[ "$count" -ne 5 ]]; then
            echo "expected 5 migration checksums, found $count" >&2
            find checksums -type f -print >&2
            exit 1
          fi
          unique=$(cat "${files[@]}" | sort -u | wc -l)
          unique="${unique//[[:space:]]/}"
          if [[ "$unique" -ne 1 ]]; then
            echo "migration checksums differ" >&2
            printf '%s\n' "${files[@]}" >&2
            cat "${files[@]}" >&2
            exit 1
          fi
          echo "embedded migration sha256 $(cat "${files[0]}")"

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build the source distribution
        run: uv build --sdist --package anumat-engine --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: anumat-engine-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  release-bundle:
    needs: [wheel, sdist, migration-checksum]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: anumat-engine-*
          path: artifacts
      - name: Assemble the publishable release bundle
        env:
          COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          version=$(uv version --short --directory packages/engine-py)
          python3 scripts/release/assemble_engine_bundle.py \
            --repo . \
            --artifacts-dir artifacts \
            --out release-bundle \
            --commit "$COMMIT" \
            --version "$version" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL"
          python3 scripts/release/verify_engine_bundle.py \
            --repo . \
            --bundle release-bundle \
            --commit "$COMMIT" \
            --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: anumat-engine-release
          path: release-bundle/*
          if-no-files-found: error

name: Publish anumat-engine

on:
  push:
    tags:
      - "engine-py@*"

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Read platform targets
        id: matrix
        run: |
          echo "include<<EOF" >> "$GITHUB_OUTPUT"
          jq -c . packages/engine-py/platforms.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.include) }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Check the tag version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#engine-py@}"
          package_version="$(uv version --short --directory packages/engine-py)"
          if [ "$version" != "$package_version" ]; then
            echo "Tag $version does not match package version $package_version" >&2
            exit 1
          fi

      - name: Build the wheel
        shell: bash
        run: bash packages/engine-py/scripts/build-wheel.sh "${{ matrix.target }}" "${{ matrix.platform }}" "${{ matrix.binary }}"

      - name: Start Postgres
        if: runner.os == 'Linux' && matrix.smoke
        run: |
          docker run -d --name anumat-engine-pg \
            -e POSTGRES_USER=anumat \
            -e POSTGRES_PASSWORD=anumat \
            -e POSTGRES_DB=anumat \
            -p 5432:5432 postgres:16
          for _ in $(seq 1 40); do
            if docker exec anumat-engine-pg pg_isready -U anumat -d anumat; then
              exit 0
            fi
            sleep 1
          done
          docker logs anumat-engine-pg
          exit 1

      - name: Start Postgres
        if: runner.os == 'macOS' && matrix.smoke
        run: |
          brew install postgresql@16
          prefix="$(brew --prefix postgresql@16)"
          export PATH="$prefix/bin:$PATH"
          initdb -D /tmp/anumat-pg --username=anumat --auth=trust --auth-host=trust
          pg_ctl -D /tmp/anumat-pg -l /tmp/anumat-pg.log -o "-p 5432" start
          for _ in $(seq 1 40); do
            if pg_isready -h 127.0.0.1 -p 5432; then
              break
            fi
            sleep 1
          done
          createdb -h 127.0.0.1 -p 5432 -U anumat anumat
          echo "$prefix/bin" >> "$GITHUB_PATH"

      - name: Start Postgres
        if: runner.os == 'Windows' && matrix.smoke
        shell: pwsh
        run: |
          choco install postgresql16 --params '/Password:anumat' -y --no-progress
          $bin = "C:\Program Files\PostgreSQL\16\bin"
          $env:Path = "$bin;$env:Path"
          $env:PGPASSWORD = "anumat"
          $ready = $false
          foreach ($try in 1..40) {
            & "$bin\pg_isready.exe" -h 127.0.0.1 -p 5432
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "Postgres did not start" }
          & "$bin\psql.exe" -U postgres -h 127.0.0.1 -c "CREATE USER anumat WITH PASSWORD 'anumat' SUPERUSER"
          & "$bin\psql.exe" -U postgres -h 127.0.0.1 -c "CREATE DATABASE anumat OWNER anumat"
          Add-Content $env:GITHUB_PATH $bin

      - name: Smoke test
        if: matrix.smoke
        shell: bash
        env:
          DATABASE_URL: postgres://anumat:anumat@127.0.0.1:5432/anumat
          ANUMAT_MIGRATION_SQL: ${{ github.workspace }}/packages/db/prisma/migrations/20260929061425_init/migration.sql
        run: |
          uv venv "$RUNNER_TEMP/anumat-engine-smoke"
          uv pip install --python "$RUNNER_TEMP/anumat-engine-smoke" dist/*.whl
          if [ -x "$RUNNER_TEMP/anumat-engine-smoke/bin/python" ]; then
            py="$RUNNER_TEMP/anumat-engine-smoke/bin/python"
          else
            py="$RUNNER_TEMP/anumat-engine-smoke/Scripts/python.exe"
          fi
          "$py" packages/engine-py/scripts/smoke.py

      - name: Upload the wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: false
          verbose: true
